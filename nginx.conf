# Chamilo LMS vhost — Symfony front controller -> PHP-FPM (127.0.0.1:9000).
# Installed as /etc/nginx/conf.d/default.conf (included by the http{} block).
# Serves the LMS over HTTP on :80; docroot is the Symfony public/ dir.
server {
    listen 80 default_server;
    server_name _;

    root /app/chamilo-lms/public;
    index index.php;

    client_max_body_size 64m;
    client_body_buffer_size 128k;

    # Front controller: anything that isn't a real file falls through to index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP: route all .php through the front controller
    location ~ \.php$ {
        fastcgi_pass          127.0.0.1:9000;
        include               fastcgi_params;
        fastcgi_param         SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param         SCRIPT_NAME     /index.php;
    }

    # Static assets: served directly, no PHP round-trip
    location ~* \.(?:css|js|gif|svg|jpe?g|png|ico|webp|woff2?|ttf|eot|otf|map)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Never serve dotfiles (.env, .git, .htaccess, ...)
    location ~ /\. {
        deny all;
    }
}
